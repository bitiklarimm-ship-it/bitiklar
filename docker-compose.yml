services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitiklar
      POSTGRES_USER: bitiklar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitiklar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitiklar"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://bitiklar:${POSTGRES_PASSWORD:-bitiklar}@db:5432/bitiklar
    volumes:
      - media:/app/media
      - ./backend/apps/accounts/migrations:/app/apps/accounts/migrations
      - ./backend/apps/catalog/migrations:/app/apps/catalog/migrations
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  media:
