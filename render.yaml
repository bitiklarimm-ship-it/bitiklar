# Render Blueprint: New > Blueprint > ushbu repozitoriyni tanlang
# Bitta web-servis: sayt + API + admin bitta manzilda (Nginx + Next.js + Django bitta konteynerda)
databases:
  - name: bitiklar-db
    databaseName: bitiklar
    user: bitiklar
    plan: basic-256mb

services:
  - type: web
    name: bitiklar
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/stats/
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: bitiklar-db, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # Saytning asosiy manzili. Domen ulanmaguncha bo'sh qoldirsangiz, bitiklar.onrender.com ishlatiladi
      - key: SITE_URL
        value: https://bitiklar.uz
      # Qo'shimcha domenlar (vergul bilan), masalan www
      - key: DJANGO_ALLOWED_HOSTS
        value: www.bitiklar.uz
      - key: NEXT_PUBLIC_SITE_URL
        value: https://bitiklar.uz
      - key: WEB_CONCURRENCY
        value: "2"
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: bitiklar-media
      - key: R2_PUBLIC_DOMAIN
        value: media.bitiklar.uz
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "1"
      # Kunlik zaxira: R2'da alohida YOPIQ bucket yarating (masalan bitiklar-backups)
      - key: BACKUP_BUCKET
        value: bitiklar-backups
      - key: BACKUP_KEEP
        value: "14"
      # Email xabarnomalar (ixtiyoriy)
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: BITIKLAR <noreply@bitiklar.uz>
      # Xatolarni kuzatish (ixtiyoriy)
      - key: SENTRY_DSN
        sync: false
