# Render Blueprint: New > Blueprint > ushbu repozitoriyni tanlang
databases:
  - name: bitiklar-db
    databaseName: bitiklar
    user: bitiklar
    plan: basic-256mb

services:
  - type: web
    name: bitiklar-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/stats/
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: bitiklar-db, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: api.bitiklar.uz,bitiklar-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://api.bitiklar.uz,https://bitiklar-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://bitiklar.uz,https://bitiklar-web.onrender.com
      - key: FRONTEND_URL
        value: https://bitiklar.uz
      - key: BACKEND_PUBLIC_URL
        value: https://api.bitiklar.uz
      - key: STORAGE_BACKEND
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "1"

  - type: web
    name: bitiklar-web
    runtime: docker
    rootDir: frontend
    envVars:
      - key: API_URL
        value: https://api.bitiklar.uz
      - key: NEXT_PUBLIC_API_URL
        value: https://api.bitiklar.uz
      - key: NEXT_PUBLIC_SITE_URL
        value: https://bitiklar.uz
